<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupling Audit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a12;
    --bg-raised: #0e0e1a;
    --bg-panel: #12121f;
    --bg-hover: #1a1830;
    --border: #1e1e35;
    --border-accent: #2a2848;
    --text: #c8c8e0;
    --text-dim: #6a6a8a;
    --text-muted: #4a4a6a;
    --purple: #a080d0;
    --purple-bright: #c8a0ff;
    --purple-dim: #6a50a0;
    --red: #e05060;
    --red-dim: #802838;
    --green: #50c878;
    --green-dim: #1a4a2a;
    --amber: #e0a840;
    --amber-dim: #604820;
    --bar-gradient: linear-gradient(90deg, #4a2878, #a060e0, #c880ff);
    --bar-red: linear-gradient(90deg, #802838, #e05060);
    --bar-green: linear-gradient(90deg, #1a4a2a, #50c878);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .noise-overlay {
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Header */
  .header {
    margin-bottom: 48px;
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -24px;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--purple-dim), transparent);
  }

  .header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 6px;
  }

  .header .subtitle {
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 300;
  }

  /* Summary cards */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }

  .stat-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    animation: cardIn 0.4s ease both;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
  }

  .stat-card:nth-child(1)::before { background: var(--purple); }
  .stat-card:nth-child(2)::before { background: var(--amber); }
  .stat-card:nth-child(3)::before { background: var(--red); }
  .stat-card:nth-child(4)::before { background: var(--green); }

  .stat-card .label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .stat-card .value {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .stat-card .detail {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stat-card:nth-child(1) { animation-delay: 0.05s; }
  .stat-card:nth-child(2) { animation-delay: 0.1s; }
  .stat-card:nth-child(3) { animation-delay: 0.15s; }
  .stat-card:nth-child(4) { animation-delay: 0.2s; }

  /* Section headers */
  .section-title {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--purple-dim);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* Tables */
  .table-wrap {
    margin-bottom: 40px;
    animation: fadeIn 0.5s ease both;
    animation-delay: 0.25s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-raised);
    border: 1px solid var(--border);
  }

  th {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: left;
    padding: 10px 14px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    user-select: none;
  }

  td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tr.file-row {
    cursor: pointer;
    transition: background 0.15s;
  }

  tr.file-row:hover {
    background: var(--bg-hover);
  }

  tr.file-row.expanded {
    background: var(--bg-hover);
    border-bottom-color: transparent;
  }

  .file-name {
    color: var(--purple-bright);
    font-weight: 500;
  }

  .file-name .dir {
    color: var(--text-dim);
    font-weight: 300;
  }

  /* Interaction bar */
  .bar-cell {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--bar-gradient);
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }

  .bar-fill::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: rgba(200, 160, 255, 0.4);
    filter: blur(4px);
  }

  .bar-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    min-width: 24px;
    text-align: right;
  }

  /* Export ratio */
  .ratio-bar-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    overflow: hidden;
  }

  .ratio-bar-fill {
    height: 100%;
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .ratio-bar-fill.safe { background: var(--bar-green); }
  .ratio-bar-fill.warn { background: linear-gradient(90deg, var(--amber-dim), var(--amber)); }
  .ratio-bar-fill.danger { background: var(--bar-red); }

  .ratio-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    min-width: 38px;
    text-align: right;
  }

  .ratio-value.safe { color: var(--green); }
  .ratio-value.warn { color: var(--amber); }
  .ratio-value.danger { color: var(--red); }

  .badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
  }

  .badge.review {
    background: var(--red-dim);
    color: var(--red);
  }

  .badge.ok {
    background: var(--green-dim);
    color: var(--green);
  }

  /* Expanded detail panel */
  .detail-row td {
    padding: 0;
    background: var(--bg-panel);
  }

  .detail-panel {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--border-accent);
  }

  .detail-panel .coupling-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }

  .coupling-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    padding: 12px 14px;
  }

  .coupling-card .mod-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--purple);
    margin-bottom: 8px;
  }

  .coupling-card .mod-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 8px;
  }

  .coupling-card .mod-stat {
    font-size: 10px;
    color: var(--text-dim);
  }

  .coupling-card .mod-stat span {
    font-weight: 700;
    color: var(--text);
  }

  .coupling-card .call-list {
    font-size: 11px;
    color: var(--text-dim);
  }

  .coupling-card .call-item {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    border-top: 1px solid var(--border);
  }

  .coupling-card .call-item .fn-name {
    color: var(--text);
  }

  .coupling-card .call-item .call-count {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--amber);
  }

  .no-calls {
    font-size: 10px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* Exports detail */
  .exports-list {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .exports-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .export-item {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    margin: 2px 3px 2px 0;
    border: 1px solid var(--border);
  }

  .export-item.exported {
    color: var(--amber);
    border-color: var(--amber-dim);
    background: rgba(224, 168, 64, 0.05);
  }

  .export-item.private {
    color: var(--text-muted);
    border-color: var(--border);
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 80px 0;
    color: var(--text-dim);
    font-size: 12px;
  }

  .loading::before {
    content: '>';
    color: var(--purple);
    animation: blink 0.8s step-end infinite;
    margin-right: 6px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .error {
    text-align: center;
    padding: 80px 0;
    color: var(--red);
    font-size: 12px;
  }

  /* Responsive */
  @media (max-width: 700px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .coupling-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div class="noise-overlay"></div>
<div class="container">

  <div class="header">
    <h1>Coupling Audit</h1>
    <div class="subtitle" id="subtitle">loading...</div>
  </div>

  <div id="app">
    <div class="loading">analyzing codebase</div>
  </div>

</div>

<script>
(async function() {
  const app = document.getElementById('app');
  const subtitle = document.getElementById('subtitle');

  let report;
  try {
    const res = await fetch('./audit-report.json');
    if (!res.ok) throw new Error(`${res.status}`);
    report = await res.json();
  } catch(e) {
    app.innerHTML = `<div class="error">Failed to load audit-report.json — run pnpm audit:report first</div>`;
    return;
  }

  const files = report.files;
  const totalFiles = files.length;
  const totalInteractions = files.reduce((s, f) => s + f.totalInteractions, 0);
  const maxInteractions = Math.max(...files.map(f => f.totalInteractions), 1);
  const highExport = files.filter(f => f.exportRatio.ratio > 50);
  const avgExportRatio = Math.round(files.reduce((s, f) => s + f.exportRatio.ratio, 0) / totalFiles);

  subtitle.textContent = `generated ${new Date(report.generated).toLocaleString()} · ${totalFiles} modules`;

  // Summary
  let html = `
    <div class="summary">
      <div class="stat-card">
        <div class="label">Modules</div>
        <div class="value">${totalFiles}</div>
        <div class="detail">source files analyzed</div>
      </div>
      <div class="stat-card">
        <div class="label">Interactions</div>
        <div class="value">${totalInteractions}</div>
        <div class="detail">cross-module function calls</div>
      </div>
      <div class="stat-card">
        <div class="label">PLOP Flags</div>
        <div class="value">${highExport.length}</div>
        <div class="detail">&gt;50% export ratio</div>
      </div>
      <div class="stat-card">
        <div class="label">Avg Export</div>
        <div class="value">${avgExportRatio}%</div>
        <div class="detail">mean export ratio</div>
      </div>
    </div>
  `;

  // Coupling table
  html += `
    <div class="table-wrap">
      <div class="section-title">Module Coupling</div>
      <table>
        <thead>
          <tr>
            <th style="width:40%">File</th>
            <th style="width:10%">Imports</th>
            <th style="width:40%">Interactions</th>
            <th style="width:10%">Modules</th>
          </tr>
        </thead>
        <tbody id="coupling-body">
  `;

  for (const f of files) {
    const id = f.path.replace(/[^a-z0-9]/gi, '_');
    const totalImported = f.moduleCoupling.reduce((s, m) => s + m.importedSymbols.length, 0);
    const modCount = f.moduleCoupling.filter(m => m.totalCalls > 0).length;
    const pct = maxInteractions > 0 ? (f.totalInteractions / maxInteractions) * 100 : 0;

    const dirMatch = f.path.match(/^(.*\/)([^/]+)$/);
    const dir = dirMatch ? dirMatch[1] : '';
    const name = dirMatch ? dirMatch[2] : f.path;

    html += `
      <tr class="file-row" data-target="${id}" onclick="toggleDetail('${id}')">
        <td><span class="file-name"><span class="dir">${dir}</span>${name}</span></td>
        <td>${totalImported}</td>
        <td>
          <div class="bar-cell">
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="bar-value">${f.totalInteractions}</span>
          </div>
        </td>
        <td>${modCount}</td>
      </tr>
      <tr class="detail-row" id="detail-${id}" style="display:none">
        <td colspan="4">
          <div class="detail-panel">
            <div class="coupling-grid">
    `;

    for (const m of f.moduleCoupling) {
      html += `
              <div class="coupling-card">
                <div class="mod-name">${m.sourceModule}</div>
                <div class="mod-stats">
                  <div class="mod-stat">imports: <span>${m.importedSymbols.length}</span></div>
                  <div class="mod-stat">calls: <span>${m.totalCalls}</span></div>
                </div>
      `;
      if (m.calls.length > 0) {
        html += `<div class="call-list">`;
        for (const c of m.calls) {
          html += `<div class="call-item"><span class="fn-name">${c.symbol}</span><span class="call-count">${c.count}x</span></div>`;
        }
        html += `</div>`;
      } else {
        html += `<div class="no-calls">types only (no runtime calls)</div>`;
      }
      html += `</div>`;
    }

    // Export info in detail
    const er = f.exportRatio;
    html += `
            </div>
            <div class="exports-list">
              <div class="exports-label">Exports (${er.exported}/${er.total})</div>
    `;
    for (const n of er.names) {
      const cls = n.isExported ? 'exported' : 'private';
      html += `<span class="export-item ${cls}">${n.name}</span>`;
    }
    html += `
            </div>
          </div>
        </td>
      </tr>
    `;
  }

  html += `</tbody></table></div>`;

  // Export ratio table
  const sortedByRatio = [...files].sort((a, b) => b.exportRatio.ratio - a.exportRatio.ratio);

  html += `
    <div class="table-wrap">
      <div class="section-title">Export Ratio (PLOP)</div>
      <table>
        <thead>
          <tr>
            <th style="width:35%">File</th>
            <th style="width:10%">Exported</th>
            <th style="width:10%">Total</th>
            <th style="width:35%">Ratio</th>
            <th style="width:10%">Status</th>
          </tr>
        </thead>
        <tbody>
  `;

  for (const f of sortedByRatio) {
    const er = f.exportRatio;
    const cls = er.ratio > 70 ? 'danger' : er.ratio > 50 ? 'warn' : 'safe';
    const badge = er.ratio > 50
      ? '<span class="badge review">review</span>'
      : '<span class="badge ok">ok</span>';

    const dirMatch = f.path.match(/^(.*\/)([^/]+)$/);
    const dir = dirMatch ? dirMatch[1] : '';
    const name = dirMatch ? dirMatch[2] : f.path;

    html += `
      <tr>
        <td><span class="file-name"><span class="dir">${dir}</span>${name}</span></td>
        <td>${er.exported}</td>
        <td>${er.total}</td>
        <td>
          <div class="bar-cell">
            <div class="ratio-bar-track"><div class="ratio-bar-fill ${cls}" style="width:${er.ratio}%"></div></div>
            <span class="ratio-value ${cls}">${er.ratio}%</span>
          </div>
        </td>
        <td>${badge}</td>
      </tr>
    `;
  }

  html += `</tbody></table></div>`;

  app.innerHTML = html;
})();

function toggleDetail(id) {
  const row = document.getElementById('detail-' + id);
  const trigger = document.querySelector(`[data-target="${id}"]`);
  if (!row || !trigger) return;

  const isVisible = row.style.display !== 'none';
  row.style.display = isVisible ? 'none' : 'table-row';
  trigger.classList.toggle('expanded', !isVisible);
}
</script>
</body>
</html>
